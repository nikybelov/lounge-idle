name: Deploy Web + Telegram Pages

# Два URL на одном GitHub Pages — ничего не затирается:
#   /lounge-idle/      → веб (ветка main)
#   /lounge-idle/tg/   → Telegram Mini App (ветка telegram-miniapp)
on:
  push:
    branches: [main, telegram-miniapp]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: web

      - name: Checkout Telegram (telegram-miniapp)
        uses: actions/checkout@v4
        with:
          ref: telegram-miniapp
          path: tg

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tg/package-lock.json

      - name: Build web
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run check
          npm run build

      - name: Build Telegram Mini App
        working-directory: tg
        env:
          VITE_FLAVOR: telegram
          VITE_APP_VERSION: 0.2.1
          VITE_BASE: /${{ github.event.repository.name }}/tg/
          VITE_TG_SYNC_URL: ${{ secrets.VITE_TG_SYNC_URL }}
        run: |
          npm ci
          npm run check
          npm run build

      - name: Assemble site (web root + /tg)
        run: |
          mkdir -p site/tg
          cp -R web/dist/. site/
          cp -R tg/dist/. site/tg/
          # чтобы /tg без слэша тоже открывался
          if [ ! -f site/tg/index.html ]; then
            echo "Telegram build missing index.html" >&2
            exit 1
          fi
          ls -la site
          ls -la site/tg

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
