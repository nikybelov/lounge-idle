name: Deploy Telegram Mini App

# Вручную: Actions → Deploy Telegram Mini App → Run workflow
# Внимание: деплоит в тот же GitHub Pages, что и main — затирает веб-URL.
# Для параллельного веба+TG лучше отдельный хост (Cloudflare) — см. docs/TELEGRAM.md
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-telegram
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          VITE_FLAVOR: telegram
          VITE_APP_VERSION: 0.2.0
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
